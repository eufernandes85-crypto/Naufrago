<script>
const $=id=>document.getElementById(id),R=Math.random,rnd=(a,b)=>a+R()*(b-a),pick=a=>a[R()*a.length|0],cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));

 $('cards').innerHTML=G.ag.filter(a=>a.alive).map(a=>'<div class=c><b>'+(a.sex=='f'?'👩':'👨')+' '+a.name+(a.kid?' · criança':' · '+a.tr)+'</b><i>'+(a.pg>=0?'🤰 ':'')+(a.sick>0?'🤒'+a.dz+' ':'')+(a.cl?'🧥 ':'')+(a.act&&a.ph==2?'😴 dormindo':a.act||'—')+'</i>'+(a.goal?'<i>🎯 '+a.goal+'</i>':'')+['🍖','💧','⚡','❤','😊'].map((e,i)=>'<span class=br>'+e+bar([a.hu,a.th,a.en,a.hp,a.mo][i],['#e8a33d','#4aa8e0','#e8d63d','#e0455a','#b08ae0'][i])+'</span>').join('')+'</div>').join('');
 $('lg').innerHTML=G.log.slice(-4).map(t=>'<div>'+t+'</div>').join('')}
let last=performance.now(),uit=0;
function loop(t){requestAnimationFrame(loop);try{loop2(t)}catch(e){console.error(e)}}
function loop2(t){const dt=Math.min(.1,(t-last)/1000);last=t;clock+=dt;
 if(started&&G&&!G.over&&speed>0){step(dt*speed/DL);
  if(SAMPLE&&!pend&&t-lastAI>7000&&G.ag.some(a=>a.alive&&!a.kid&&!(G.q[a.id]||[]).length))think();if(SAMPLE&&!gmPend&&G.day>=Math.max(4,gmAt+2))gm();if(G.cr.length&&!jPend)judge()}
 if(G){draw();if(t-uit>400){uit=t;ui()}}}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x==b))});
$('go').onclick=async()=>{audio();newGame();started=true;speed=1;$('ov').style.display='none';
 try{SAMPLE=await window.claude.use('sample')}catch(e){SAMPLE=null}
 if(!SAMPLE){try{const pr=await fetch('/.netlify/functions/ai');if(pr.ok)SAMPLE=async p=>{const r=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});if(!r.ok)throw new Error('ai '+r.status);return await r.json()}}catch(e){}}
 if(SAMPLE)think()};
let Z=2.1,PX=0,PY=0,VS=1,VX=0,VY=0;
function vw(){const c0=(innerWidth/2-OX)/S,c1=(innerHeight/2-OY)/S;VS=S*Z;VX=innerWidth/2-(c0+PX)*VS;VY=innerHeight/2-(c1+PY)*VS}
function clampP(){PX=cl(PX,-650,650);PY=cl(PY,-800,800)}
function zoomAt(f,sx,sy){const nz=cl(Z*f,.5,5);if(nz==Z)return;vw();const wx=(sx-VX)/VS,wy=(sy-VY)/VS;Z=nz;vw();PX+=wx-(sx-VX)/VS;PY+=wy-(sy-VY)/VS;clampP()}
const pts=new Map();
cv.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId),n=[e.clientX,e.clientY];
 if(pts.size==1){PX-=(n[0]-o[0])/VS;PY-=(n[1]-o[1])/VS}
 else if(pts.size==2){const ot=[...pts].find(([id])=>id!=e.pointerId)[1],d0=Math.hypot(o[0]-ot[0],o[1]-ot[1]),d1=Math.hypot(n[0]-ot[0],n[1]-ot[1]);if(d0>0)zoomAt(d1/d0,(n[0]+ot[0])/2,(n[1]+ot[1])/2)}
 pts.set(e.pointerId,n);clampP()});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>pts.delete(e.pointerId)));
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY)},{passive:false});
$('zi').onclick=()=>zoomAt(1.25,innerWidth/2,innerHeight/2);$('zo').onclick=()=>zoomAt(.8,innerWidth/2,innerHeight/2);$('zr').onclick=()=>{Z=1;PX=0;PY=0};$('mu').onclick=()=>{musicOn=!musicOn;if(mg)mg.gain.value=musicOn?.55:0;$('mu').style.opacity=musicOn?1:.45};
window.onresize=rs;rs();newGame();requestAnimationFrame(loop);
